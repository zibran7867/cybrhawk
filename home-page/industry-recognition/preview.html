<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Industry Recognition — Preview</title>

  <!-- The site font. On the live homepage Elementor already loads it;
       the preview loads it here so the section inherits it the same way. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">

  <!-- The real section stylesheet. -->
  <link rel="stylesheet" href="industry-recognition.css">

  <style>
    /* Preview-only scaffolding: recreates the Elementor container and the
       light sections around it. Nothing here is part of the design. */
    html, body { margin: 0; padding: 0; }
    body {
      font-family: "Figtree", sans-serif;
      background: #fff;
      color: #5b6478;
    }
    .pv-neighbour {
      display: grid;
      place-items: center;
      min-height: 320px;
      font: 600 11px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    .e-con { display: flex; flex-direction: column; }
    .e-con-inner { width: 100%; max-width: 1140px; margin: 0 auto; }
  </style>
</head>
<body>

  <div class="pv-neighbour">Previous homepage section</div>

  <!-- What the editor adds in Elementor: an empty container with this class. -->
  <div class="elementor-element e-con e-parent industry-recognition">
    <div class="e-con-inner"></div>
  </div>

  <div class="pv-neighbour">Next homepage section</div>

  <script src="industry-recognition.js"></script>
</body>
</html>
